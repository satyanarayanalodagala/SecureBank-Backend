# =====================================================
# APPLICATION
# =====================================================

spring.application.name=SecureBank



# =====================================================
# DATABASE CONFIGURATION
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3306/securebankdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# =====================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false



# =====================================================
# SERVER CONFIGURATION
# =====================================================

server.port=8080



# =====================================================
# JWT CONFIGURATION
# =====================================================

jwt.secret=SecureBankJwtSecretKeyForSpringBootApplication2026SecureBank
jwt.expiration=86400000



# =====================================================
# ADMIN SECURITY CONFIGURATION
# =====================================================

admin.secret.key=SecureBank_Admin_Key#2026



# =====================================================
# EMAIL CONFIGURATION (GMAIL SMTP)
# =====================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=securebank.digital@gmail.com

spring.mail.password=mvii rjuf ajlx xuto

spring.mail.default-encoding=UTF-8



# =====================================================
# SMTP SECURITY
# =====================================================

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true



# =====================================================
# SMTP TIMEOUT SETTINGS
# =====================================================

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000



# =====================================================
# JACKSON CONFIGURATION
# =====================================================

spring.jackson.time-zone=Asia/Kolkata



# =====================================================
# LOGGING CONFIGURATION
# =====================================================

logging.file.name=logs/application.log

logging.level.root=INFO

logging.level.com.securebank=DEBUG

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE



# =====================================================
# LOGGING FORMAT
# =====================================================

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{36} - %msg%n

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{36} - %msg%n



# =====================================================
# FILE UPLOAD CONFIGURATION
# =====================================================

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=5MB

spring.servlet.multipart.max-request-size=5MB



# =====================================================
# PROFILE IMAGE STORAGE
# =====================================================

file.upload-dir=uploads/profile/